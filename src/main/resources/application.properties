# Defaults. Override with -Dconfig.file=/path/app.properties or STATEMENTS_* env vars
# (STATEMENTS_DB_PASSWORD -> db.password, STATEMENTS_BATCH_CONCURRENCY -> batch.concurrency).

app.zone=Africa/Johannesburg
db.url=jdbc:postgresql://localhost:5432/bank
db.username=statements_batch
# db.password is supplied via STATEMENTS_DB_PASSWORD. Never commit it.
db.fetch.size=500
db.query.timeout.seconds=60

# 0 = one worker per CPU core (filling and exporting are CPU-bound)
batch.concurrency=0
batch.statement.timeout.seconds=180
batch.transient.retries=2
batch.max.runs.per.statement=3
batch.stale.claim.minutes=30
batch.account.page.size=500
# Must exceed batch.statement.timeout.seconds so in-flight work can finish
batch.shutdown.grace.seconds=200

# Fill timeout is deliberately shorter than the statement timeout so the
# governor fails the fill with a precise error before the watchdog interrupts.
report.fill.timeout.millis=120000
report.max.pages=400
report.virtualizer.max.pages.in.memory=40
# Relative to the directory the JVM is started from. Production overrides these
# with STATEMENTS_REPORT_VIRTUALIZER_SWAP_DIR / STATEMENTS_REPORT_WORK_DIR.
report.virtualizer.swap.dir=./swap
report.work.dir=./work

# s3 | local. Local for now (S3ObjectStore is not implemented yet): PDFs land in
# storage.local.dir/statements/{tenant}/{yyyy}/{MM}/{accountNo}.pdf
storage.type=local
storage.s3.region=af-south-1
storage.s3.bucket=bank-statements-prod
storage.s3.kms.key.id=alias/statements
storage.local.dir=./out